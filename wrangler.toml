# Cloudflare Workers（静的アセット + LINE Bot Webhook）
#
# 🚨 このファイルはこれまで main にありませんでした
# ─────────────────────────────────────────────────
# wrangler の設定は branch `feat/wang-workers-static`（コミット 18b3f93）に
# あるだけで main に未マージでした。ここでは静的配信の設定（[assets]）を
# そのまま引き継ぎつつ、LINE Bot の Webhook を同じ Worker の1ルートとして
# 追加しています（worker/index.js）。マージ前に一度レビューをお願いします。
#
# なぜ Worker スクリプト（main）を持つ構成に変えたか
# ──────────────────────────────────────────────────
# これまでは main を書かず [assets] だけの「Workerコードを1行も持たない」
# 純粋な静的ホスティングでした。LINE の Webhook は公開 HTTPS への POST を
# 受ける必要があり、静的アセットだけでは受けられないため、Worker スクリプトを
# 追加しています。
#
# main を持つ構成では、リクエストは常に worker/index.js を通ります。
# 静的ファイルは Worker 側から env.ASSETS.fetch(request) で明示的に
# 返しているので、/line/webhook 以外の挙動（トップページ・courses.built.json
# など）はこれまでと変わりません。
#
# 口コミの投稿（POST /api/reviews）はこの構成でも受けられません
# （D1 未接続のため）。index.html 側の CAN_POST=false はそのままです。
name = "rakutan-db"
compatibility_date = "2026-08-20"

main = "worker/index.js"

[assets]
directory = "./web"
binding = "ASSETS"
# not_found_handling は既定（none）のまま。画面遷移は全部クエリ文字列
# （?year=1&cond=…）で、パスは / しか無いので、SPA フォールバックを入れると
# 存在しないURLまで index.html を返してしまう。

# お気に入り・検索履歴の保存先（2026-08-25 wangさんの登録制の方針）。
# LINEユーザーIDをキーに保存する。個人情報（学部・学年など）は今回入れない。
[[d1_databases]]
binding = "DB"
database_name = "rakutan-favorites"
database_id = "9176d42b-a737-4a9e-971b-c5bed3449e41"

# 「実際に使われた回数」の落とし先（2026-09-03）。
# ページ表示だけでなく、検索・詳細を開くという操作を数える。
# Cloudflare Web Analytics の beacon は広告ブロッカーに塞がれるので
# あの数字は下限にしかならない。こちらは同じドメインなので塞がれない。
# Workers Free で 1日10万件の書き込みまで無料（読みは1日1万クエリ）。
# 読み出しは tools/stats.mjs（SQL API）。ダッシュボードには出ない。
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "rakutan_use"

# 毎朝のアクセス速報（2026-09-03）。
# 23:00 UTC ＝ JST 08:00。きのう一日ぶんが JST で閉じてから走る。
# 中身は worker/index.js の runDailyTraffic（scheduled ハンドラ）。
# 手元で試すときは:
#   npx wrangler dev --test-scheduled
#   curl "http://localhost:8787/__scheduled?cron=0+23+*+*+*"
[triggers]
crons = ["0 23 * * *"]

# シークレットはここに書かない。デプロイ後に以下で登録する:
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
#   npx wrangler secret put FEEDBACK_DISCORD_WEBHOOK
#   npx wrangler secret put REVIEW_DISCORD_WEBHOOK
#   npx wrangler secret put STATS_DISCORD_WEBHOOK
#   npx wrangler secret put CF_ACCOUNT_ID
#   npx wrangler secret put CF_API_TOKEN
#
# FEEDBACK_DISCORD_WEBHOOK は意見箱（POST /api/feedback）の落とし先。
# Discord の「サイトへのご意見」チャンネル → 設定 → 連携サービス →
# ウェブフック → 新規ウェブフック で URL を作って貼る。
# 未設定のあいだ /api/feedback は 503 を返し、画面には
# 「いまは受け取れませんでした」と出る（受け取ったふりをして捨てない）。

# REVIEW_DISCORD_WEBHOOK は口コミ投稿の通知（POST /api/kuchikomi）の落とし先。
# 意見箱とは別チャンネルに落とせるよう、secret を分けている。
# こちらは未設定でも投稿は今まで通り成功する（鳴らないだけ）。通知のために
# 投稿を止めないのが設計。

# STATS_DISCORD_WEBHOOK は毎朝のアクセス速報の落とし先（Discord の
# 「サイトトラフィック」チャンネル）。未設定のあいだ cron は外へ一切出ない
# ―― 誰も見ていないチャンネルへ毎朝投げ続けるより、鳴らない方がまし。
#
# CF_ACCOUNT_ID / CF_API_TOKEN は、速報が Analytics Engine を SQL で読むための鍵。
# トークンの権限は **アカウント / Account Analytics / 読み取り** ひとつだけで足りる
# （作り方は tools/stats.mjs の先頭。読み手が同じなので同じトークンを使い回せる）。
# 🚨 アカウントIDも secret で入れる。このリポジトリは public。
