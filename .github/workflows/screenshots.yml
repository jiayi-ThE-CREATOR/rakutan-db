name: スクショ差分

# PR を出すたびに、main と PR の画面を撮って並べる。
# diff が読めない人でも「見た目で」何が変わったか分かるようにするのが目的。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - name: PR のコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Playwright を入れる
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: AFTER（このPR）を撮る
        run: |
          python3 server.py --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health >/dev/null && break; sleep 1; done
          node tools/shots.mjs shots/after
          kill %1 || true

      - name: BEFORE（main）を撮る
        run: |
          git stash --include-untracked || true
          git checkout ${{ github.event.pull_request.base.sha }} -- . || true
          python3 server.py --port 8001 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/health >/dev/null && break; sleep 1; done
          node tools/shots.mjs shots/before http://127.0.0.1:8001 || echo "before の撮影に失敗（新規画面なら正常）"
          kill %1 || true
        continue-on-error: true

      - name: 並べた画像をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-pr-${{ github.event.pull_request.number }}
          path: shots/
          retention-days: 14

      - name: PR にコメント
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### スクショ差分',
              '',
              `**[Artifacts から before / after をダウンロード](${url})**`,
              '',
              '撮った画面：トップ（スマホ / PC）／検索結果（スマホ）／科目詳細の根拠展開／進捗ダッシュボード',
              '',
              '> コードが読めなくても、画像を見て気づいたことを書いてください。',
              '> とくにスマホ表示 ―― 利用の大半はスマホです。'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
